name: 🏁 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - run: npm test
      # production-only audit: dev-tool advisories (e.g. esbuild dev-server)
      # don't reach a shipped MCP server, and must not red-badge it.
      - run: npm audit --omit=dev --audit-level=high
